<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EstateEase - Find Your Dream Property</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">EstateEase</h1>
            <div class="actions">
                <button id="btn-add">Add Listing</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="search-panel">
            <input id="city" placeholder="City" />
            <select id="ptype">
                <option value="">Any type</option>
                <option>House</option>
                <option>Apartment</option>
                <option>Unit</option>
                <option>Land</option>
                <option>Other</option>
            </select>
            <button id="btn-search">Search</button>
        </section>

        <section id="listings" class="grid"></section>
        <div id="pagination" class="pagination"></div>
    </main>
    <section class="form-section" id="add-listing-section">
        <h2>Add New Listing</h2>
        <form class="add-listing-form">
            <div class="form-group">
                <label for="title">Property Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Spacious 3-BHK in Pune">
            </div>

            <div class="form-group">
                <label for="add-city">City</label>
                <input type="text" id="add-city" name="city" placeholder="e.g. Mumbai">
            </div>

            <div class="form-group">
                <label for="property_type">Property Type</label>
                <select id="property_type" name="property_type">
                    <option value="">Select type</option>
                    <option value="House">House</option>
                    <option value="Apartment">Apartment</option>
                    <option value="Unit">Unit</option>
                    <option value="Land">Land</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="bedrooms">Bedrooms</label>
                    <input type="number" id="bedrooms" name="bedrooms" min="0">
                </div>
                <div class="form-group">
                    <label for="bathrooms">Bathrooms</label>
                    <input type="number" id="bathrooms" name="bathrooms" min="0">
                </div>
                <div class="form-group">
                    <label for="area_sq_m">Area (m²)</label>
                    <input type="number" id="area_sq_m" name="area_sq_m" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" id="price" name="price" placeholder="e.g. 6500000">
            </div>

            <div class="form-group">
                <label for="image_url">Image URL</label>
                <input type="url" id="image_url" name="image_url" placeholder="https://example.com/photo.jpg">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4"
                    placeholder="Describe the property..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Add Listing</button>
        </form>
    </section>

    <script src="js/app.js"></script>
</body>

</html>
